stt:
  # "google_free" (default; free, needs internet) uses SpeechRecognition's Microphone,
  # which needs PyAudio — an *optional* install (VERONICA installs no mic package by
  # default; voice mode is off unless you add one). "faster_whisper" / "vosk" are fully
  # offline and capture audio via sounddevice instead.
  # Phase 11F: google_free and faster_whisper now both capture through VERONICA's
  # sounddevice MicrophoneInput, so PyAudio is no longer needed for either.
  # 2026-10-17: "auto" = offline Whisper on this PC first, then the cloud only when the
  # offline read doubts itself. Measured over identical clips on this PC:
  #     offline Whisper   2.9% word errors  1.2 s  free, no internet, nothing leaves the PC
  #     Gemini Flash-Lite 1.3%              1.9 s  free daily quota, clip sent to Google
  #     Google Web Speech 10.4%             1.3 s  free, clip sent to Google
  # Offline leads because it is free, works with no internet and is already three times
  # more accurate than Google, which drops whole words (it heard "ask Jev" as "asked").
  # Groq (8% on an earlier clip set) is tried second when GROQ_API_KEY is set. On
  # 2026-10-17 it answered 404 to everything for a day, then recovered; offline leads so
  # an outage like that can't take her hearing with it.
  backend: "auto"
  # The accurate cloud read, used as the second opinion. Flash-Lite is as quick as Google
  # and has a far larger free quota than full Flash (~20 requests a day).
  gemini_stt_model: "gemini-flash-lite-latest"
  offline_whisper_model: "base"   # the "auto" chain's own model: tiny/base/small.en/...
                                  # base = 2.9% errors at ~4x realtime here; small.en is
                                  # no better on clear speech and only 1.4x realtime.
  # When the offline read scores below this, ask Gemini and prefer its answer. Only clips
  # Whisper was unsure about leave this PC. Set to 0 to keep speech fully offline.
  escalate_below_logprob: -0.55
  whisper_min_logprob: -0.78      # below this, a Whisper transcript is treated as invented
  # previous default: backend: "google_free"          # "google_free" (needs internet) | "faster_whisper" (offline; pip install faster-whisper) | "vosk" (offline) | "none"
  mic_backend: "sounddevice"      # "sounddevice" | "pyaudio" (only if PyAudio is installed)
  mic_device_name: "Microphone Array"  # found by name, so Windows renumbering devices can't break it
  mic_device_index: 1             # fallback only, if no device with that name exists
  min_speech_rms: 40              # speech-start floor; the real threshold is 3x the measured room level
                                  # (was 120: normal speech from a distance peaked ~50-96 and needed shouting)
  silence_over_ambient: 1.6      # sound under 1.6x the room level is silence, so a fan or a small noise no longer keeps her listening
  max_utterance_s: 8.0
  vosk_model_path: "models/vosk-model-small-en-us"
  faster_whisper_model: "base"    # faster-whisper model: tiny/base/small/medium/large-v3 (only when backend is faster_whisper)
  faster_whisper_compute_type: "float32"   # float16 (CUDA) | int8 | float32
  language: "en-IN"
  energy_threshold: 300
  pause_threshold: 0.65           # silence that ends your sentence (was 0.8; lower = faster replies,
                                  # too low and she cuts you off mid-pause)
  highpass_hz: 100                # strip fan/AC hum below this before recognition (0 = off)
  min_voiced_s: 0.25              # clicks and coughs shorter than this aren't speech
  confirm_below_confidence: 0.45  # after "Veronica": ask "did you say...?" when this unsure (0 = never)
  corrections_path: "data/stt_corrections.json"   # "when I say X, I mean Y", taught by voice

tts:
  # 2026-10-17: free FRIDAY-style voice: a soft Irish woman's voice (Microsoft Emily, via
  # edge-tts: free, no key, no monthly limit). A generic Irish voice, not a copy of any actor.
  # Back to ElevenLabs: backend "elevenlabs" (free plan = 10k credits a month).
  # 2026-10-17 later: Kokoro (backend "kokoro") runs on this PC: no internet wait, no
  # limits, British "bf_emma" closest to ElevenLabs' Alice. Change by voice: "what voices
  # do you have?", "change your voice to Emily" (the Irish one), "try the next voice".
  # 2026-10-17 evening: back to ElevenLabs' Alice, the voice the user liked best. When its
  # free monthly credits run out she switches by herself to "veronica", a blend of Kokoro
  # voices on this PC (no wait, no limit), and goes back to Alice when they return.
  # 2026-10-18: main voice = Supertonic "F2" ("Female 2" on freetts.com), on this PC: no wait,
  # no credits. Later: ElevenLabs' Alice once the monthly credits come back: backend "elevenlabs"
  # (elevenlabs_voice_id below is Alice), or say "change your voice to Alice".
  backend: "supertonic"
  # If the main voice can't speak: the Kokoro blend "veronica" (on this PC), then Windows'.
  # With backend "elevenlabs", set this back to Supertonic F2: backup_backend supertonic, backup_voice F2.
  backup_backend: "kokoro"
  backup_voice: "veronica"
  backup_minutes: 180
  # Free plan: only ElevenLabs' built-in voices work over the API. Built-ins tested OK:
  #   Alice Xb7hH8MSUJpSbSDYk0k2 | Jessica cgSgspJ2msm6clMCkdW9 | Matilda XrExE9yKIg1WjnnlVkGX
  # Elise (library voice) EST9Ui6982FZPSi7gCHi needs a paid ElevenLabs plan.
  elevenlabs_voice_id: "Xb7hH8MSUJpSbSDYk0k2"
  elevenlabs_model: "eleven_flash_v2_5"
  # previous: backend "fish_audio"  # FRIDAY voice (Phase 11B) — Fish Audio reference
  voice: "F2"                      # supertonic: F1-F5 M1-M5 | kokoro: veronica (blend) bf_emma bf_isabella af_heart | edge_tts: en-IE-EmilyNeural
  rate: "+5%"
  piper_model: "en_US-lessac-medium"
  fish_audio_reference_id: "8ec7352282684afc90cdfef961cbdae7"
  cache_dir: "data/tts_cache"

wake_word:
  enabled: false
  mode: "push_to_talk"            # "push_to_talk" | "energy_spike"
  spike_ratio: 3.0

memory:
  long_term_path: "data/memory.json"
  include_facts_in_prompt: true     # remembered facts + home city go with every question
  persist_conversation: true        # restore the recent conversation after a restart
  resume_hours: 12                  # ...if it is younger than this
  short_term_max_messages: 40     # ~20 exchanges of conversation context (was 20 messages)

safety:
  # SAFE means "confirm literally everything, including read-only actions" — VERONICA
  # asks before it does anything at all. Loosen to MODERATE/SENSITIVE later once you
  # trust the fast-path commands you use daily (see docs/GETTING_STARTED.md).
  # 2026-10-15: owner asked to confirm only destructive actions. SAFE + MODERATE tools now
  # run without asking (time, weather, web search, open apps/sites, volume, notes,
  # screenshots); SENSITIVE + CRITICAL still ask (write_file, delete_file,
  # run_shell_command, destructive key combos).
  require_confirmation_above: "SENSITIVE"  # SAFE | MODERATE | SENSITIVE | CRITICAL
  dry_run: false

# Streaming LLM V1 (opt-in, off by default). Enables progressive output for the LLM
# turn via provider-specific streaming endpoints (Ollama NDJSON, OpenAI-compatible SSE,
# etc.). When disabled or no streaming-capable model is available, VERONICA falls back
# to the classic chat() path and is honest about it — never a fake stream.
streaming:
  # 2026-10-17: on, so in voice mode she starts speaking the first sentence while the
  # model is still writing the rest (voice/live_speech.py). A stream that fails before
  # any text falls back to the normal path and its backup models.
  enabled: true                # master switch (config.streaming.enabled)
  preferred: true              # stream on every turn the model supports (False = stream only when user asks)
  speak_while_writing: true    # voice mode: speak each sentence as soon as it's written
  max_response_chars: 8192     # accumulator cap (0 = uncapped); explicit truncated=True at the cap
  max_buffer_chars: 1024       # emit-buffer cap between deltas (never changes final text)
  coalesce_ms: 60              # minimum interval between delta events (0 = per-chunk)
  first_token_timeout_s: 12.0  # nothing received within this -> FAILED -> backup models
  idle_timeout_s: 60.0         # silence between deltas -> FAILED timeout
  overall_timeout_s: 300.0     # hard ceiling on one streaming turn

# Context Window Management V1 (opt-in, off by default). The dedicated context layer
# answers "what should be supplied to the model for THIS request?" — structured
# selection, per-source token budgets, scoring, and status-preserving compression.
# Disabled, the orchestrator keeps its legacy message assembly byte-identical.
# See docs/CONTEXT_WINDOW.md.
# context:
#   enabled: true                      # master switch
#   default_context_window: 8192       # used when the routed model declares no window
#   compression_enabled: true          # drop lowest-value, then summarize, status-preserving
#   max_context_items: 64              # hard ceiling on selected items per request
#   inline_tools_in_prompt: false      # true = tool schemas budgeted into the prompt body
#   output_reserve: 1024               # tokens reserved for the model's reply
#   safety_reserve: 256                # tokens kept free to guarantee the safety block
#   budget_system: 2000                # per-source token budgets (input window split)
#   budget_conversation: 3000
#   budget_memory: 1200
#   budget_tools: 1500
#   budget_observation: 800
#   safety_instruction: ""             # optional extra hard boundary text (required, never compressed)

# Continuous Screen Perception V1 (opt-in, off by default). The ContinuousObservationService
# maintains continuous desktop understanding via background observation (UIA, screen capture,
# OCR) with change detection, importance filtering, and event-driven SSE updates for the GUI.
# Observation ONLY — no autonomous actions. See docs/CONTINUOUS_OBSERVATION.md.
# observation:
#   enabled: true                       # master switch
#   interval_seconds: 2.0               # capture interval (seconds)
#   change_strategy: "ACTIVE"           # IDLE | ACTIVE | WAITING | ACTION | ERROR
#   max_queue_size: 50                  # internal frame queue (backpressure)
#   max_recent_events: 100              # in-memory event history for GUI/history
#   task_aware_enabled: true            # bias importance toward task-relevant windows
#   screen_capture_enabled: true        # enable screen capture provider
#   uia_enabled: true                   # enable UI Automation provider
#   ocr_enabled: false                  # enable OCR provider (heavy; opt-in)
#   graceful_degradation: true          # continue on provider failures

learning:
  # Experience-based learning v1: records task outcomes (what worked / what failed),
  # extracts learning signals, and tracks evidence-based confidence. Set enabled: false
  # to turn it off entirely — task execution is unaffected either way.
  enabled: true
  experience_path: "data/experiences.jsonl"   # append-only JSONL experience log
  confidence_path: "data/confidence.json"     # per-strategy success/failure counts

  # Phase 4 — controlled behavioral adaptation. The learning system may recommend or
  # transform an EXECUTION PLAN only; it never executes tools directly. Actual tool
  # execution always stays in TaskExecutor → ToolRegistry.dispatch() → permission gate.
  adaptation_enabled: true
  # Confidence floor: below this, no adaptation at all. THESE ARE THE ONLY confidence
  # thresholds used — the adapter reuses the existing ConfidenceTracker values.
  adaptation_min_confidence: 0.80       # < 0.80: never adapt
  # At or above this AND with sufficient repeated evidence, the preference is "strong"
  # and may change which tool a plan step calls (safety/gate permitting).
  adaptation_strong_confidence: 0.90
  # Repeated independent successes required before a strong preference is applied.
  adaptation_min_evidence: 3

  # Phase 5 — learning effectiveness & strategy evolution (deterministic, observational).
  # Metrics derive every statistic from the stored experiences — no second source of truth.
  metrics_enabled: true                 # compute learning analytics from experience data
  strategy_evolution_enabled: true      # track strategy states (OBSERVED → PROMISING → VALIDATED → DEGRADED)
  # Evidence thresholds for strategy promotion. Conservative and configurable; the module
  # defaults (also conservative) match these values when the config is silent.
  evidence_weak: 2                      # 2+ successes/recoveries → PROMISING
  evidence_normal: 3                    # 3+ successes/recoveries → eligible for normal confidence
  evidence_strong: 5                    # 5+ successes/recoveries → eligible for VALIDATED
  evidence_high: 10                     # 10+ successes/recoveries → high-evidence strategy

log_level: "INFO"
log_file: "data/veronica.log"
# "conversation": the terminal shows only your words and VERONICA's (plus anything you
# need to know, said by her). Every log/status line still goes to log_file.
# "full": show everything (tool registration, routing, [listening...]) for troubleshooting.
console_mode: "conversation"

# Voice / continuous listening — Phase 11C (disabled by default; transport layer only)
voice:
  enabled: false
  continuous_listening: false
  wake_words: ["Veronica", "Vero", "V"]
  listen_timeout_s: 10.0
  max_utterance_s: 8.0
  silence_duration_s: 1.0
  return_to_listen: true
  suppress_playback_during_capture: true
  barge_in_enabled: false
  barge_in_threshold: 0.02
  barge_in_min_speech_ms: 300
  barge_in_guard_ms: 300
  barge_in_cooldown_ms: 500
  # 11E.1 — real audio backend config (master switches remain false; user opt-in)
  mic_backend: "sounddevice"          # "sounddevice" (default, Python 3.14-compatible) | "pyaudio" (optional fallback)
  mic_device_index: 1                 # "Microphone Array (3- Realtek(R)"; null = system default
  mic_sample_rate: 16000
  mic_chunk_size: 1024
  mic_channels: 1
  wake_backend: "openwakeword"         # "openwakeword" | "mock"
  wake_model_path: "veronica/models/veronica_wake_model.onnx"  # trained ONNX model (relative to project root)
  wake_threshold: 0.35                 # score needed to wake with `--wake`; lower = more sensitive
  follow_up_seconds: 8                 # (only used when conversation_mode is false) keep talking
                                       # for 8 s after a reply with no wake word; 0 = always wake word
  conversation_mode: true              # once you say "Veronica" the conversation stays open — keep
                                       # talking with no wake word until you end it ("thanks", "bye",
                                       # "that's all", "stop"). The wake word only starts a conversation.
  conversation_idle_timeout_s: 300     # safety only: if you go silent this long, drop back to the
                                       # wake word so the mic isn't live forever. 0 = never (stay open)
  conversation_min_confidence: 0.6     # open conversation: ignore speech she's this unsure of
  conversation_speech_ratio: 3.0       # ...or that isn't 3x louder than the room (a TV, people nearby)
  barge_in: "wake_word"                # say "Veronica" while she talks to stop her ("off" to disable)
  shared_mic: true                     # one always-open mic stream: faster turns, no clipped first words
  # 2026-10-18: earphones mode. With earphones that have a mic (Bluetooth headset, or a
  # headset in the jack), she listens through THAT mic instead of the laptop's, boosts
  # quiet speech and lowers the bars below, so a quiet "Veronica" works in public.
  # Checked at start-up: put the earphones in before starting her. "on" = always,
  # "off" = never (use "off" if your earphones have no mic and she stops hearing you).
  # 2026-10-18: the model takes 3-9 s before its first word, so the moment you finish
  # she says one of these (made once in her voice, then instant). Not for commands she
  # runs herself ("open YouTube"): those answer quickly anyway. false = off.
  quick_ack: true
  quick_ack_phrases: ["Mm-hm.", "One sec.", "Let me see.", "Okay.", "Sure, one moment."]
  earphones:
    mode: "auto"
    mic_names: ["Headset", "Hands-Free", "Handsfree", "AirPods", "Buds", "Earbuds", "Earphone", "Jack Mic"]
    gain: 3.0                          # quiet speech made up to 3x louder (never clipped)
    wake_threshold: 0.28               # normal: wake_threshold above (0.35)
    min_speech_rms: 25                 # normal: stt.min_speech_rms (40)
    speech_ratio: 1.8                  # you vs the people around you (normal: 2.5 / 3.0)

# Fish Audio voice configuration — Phase 11B (FRIDAY voice)
# Reference ID is not a secret; API key remains in config/.env only.
fish_audio:
  reference_id: "8ec7352282684afc90cdfef961cbdae7"
  model: "s2.1-pro-free"  # Fish Audio free developer model (fix for 402)
  format: "mp3"

# God's Eye View (external/gods-eye-view, MIT) — live PUBLIC data: aircraft, satellites,
# earthquakes, public traffic cameras, weather, launches, ships (ships/fires need free keys
# in external/gods-eye-view/.env). VERONICA starts its server hidden, answers by voice from
# it, and "show me" / "open the globe" opens the 3D globe on what was just asked.
# Add/remove any of the app's 30 tools in `tools` (military/ALPR are left out by default).
gods_eye:
  enabled: true
  path: "external/gods-eye-view"
  base_url: "http://localhost:4173"
  auto_start: true
  default_radius_km: 100
  tools: [aircraft_in_area, find_aircraft, get_aircraft_info, satellites_overhead, next_satellite_pass,
          get_earthquakes, get_recent_launches, find_cctv_cameras, get_cctv_snapshot, get_weather_map,
          get_cyclones, situation_brief, vessels_in_area, show_in_gods_eye_view]

# Proactive VERONICA: speaks up on her own (battery, overload, low disk, rain within the hour,
# long sessions) and greets you whenever you open the laptop. Never talks over you; holds non-urgent alerts while a
# fullscreen game/movie is in front; only urgent ones in quiet hours. Say "pause alerts"
# (for N hours/minutes) / "resume alerts".
# What VERONICA scrubs from everything sent to the cloud model (safety/privacy.py).
# Her own words still go to Gemini (that is how she answers you), but these never leave
# the machine, even if you say one aloud or it is on screen: API keys, tokens, passwords,
# card numbers, CVV/PIN, bank/IFSC numbers, and government IDs (SSN, Aadhaar, PAN).
privacy:
  enabled: true
  redact_financial: true
  redact_government_ids: true
  log_redactions: true          # note locally that something was removed (never the value)
  extra_patterns: []            # your own regexes to redact, e.g. ["EMP-\d{4}"]

# "Learn Python" study notes and "write me a script" (veronica/tools/learning_tools.py).
# Studying and writing code never ask; running code always asks (yes/no) first.
coding:
  enabled: true
  knowledge_path: "data/knowledge.json"   # what she has learned (gitignored data/)
  projects_dir: ""          # empty = Documents\VERONICA Projects
  editor: ""                # app to show code in; empty = VS Code if installed, else Notepad
  run_timeout_s: 60
  max_fix_attempts: 2       # after a failed run: fix + rerun at most this many times

# World Monitor (github.com/koala73/worldmonitor), self-hosted with Docker in
# external/worldmonitor: conflicts, military flights, ships, markets, outages, country risk.
# Its MCP is free when self-hosted (key: WORLDMONITOR_KEY in config/.env). Needs Docker
# Desktop running; the first start builds its images (slow, once).
world_monitor:
  enabled: true
  path: "external/worldmonitor"
  base_url: "http://localhost:3000"
  auto_start: true
  seed_every_minutes: 60
  # It offers 94 tools; these are the ones worth having by voice (all read-only).
  tools: [get_world_brief, get_country_brief, get_country_risk, get_conflict_events,
          get_natural_disasters, get_imd_cyclone_marine, get_military_posture, get_cyber_threats,
          get_internet_activity, get_market_data, get_aviation_status, get_maritime_activity,
          get_chokepoint_status, get_health_signals, get_alert_digest, get_hotspot_escalation,
          verify_claim, get_positive_events]

proactive:
  enabled: true
  check_every_s: 60
  battery: true
  performance: true
  disk: true
  rain: true
  greet_on_open: true              # log in / open the lid / come back: greeting, time, weather and
                                   # top headlines, spoken right away — no wake word needed
  greet_cooldown_minutes: 60       # at most one greeting an hour
  away_minutes: 15                 # away this long, then back = greet again (if the hour has passed)
  break_after_minutes: 120
  quiet_start_hour: 23
  quiet_end_hour: 7

# Understanding (core/understanding.py, core/grounding.py): the window you're looking at
# ("close this"), "it" / "again" / "the second one", your own words ("my notes means
# Obsidian"), lessons from "No, I meant ...", a style note (late, rushed, "why", a game),
# Wikipedia sources for factual questions with figures checked, and multi-step tasks.
understanding:
  enabled: true
  ground_facts: true
  intents: true        # understand the meaning, not the exact words (core/intents.py, docs/UNDERSTANDING.md)

# Mem0 (github.com/mem0ai/mem0): facts picked up from ordinary conversation ("I prefer tea",
# "my exam is on Friday"), kept on this PC in data/mem0/. Gemini Flash-Lite writes the facts
# and Gemini embeddings search them; text passes the privacy guard, secrets are never stored.
mem0:
  enabled: true
  recall_k: 5

# 2026-10-18: she gets to know you slowly and her manner settles around you (how chatty,
# how much humour, what you care about). After every `every_turns` exchanges one background
# Gemini call updates a short profile in data/rapport.json, changing her manner by at most
# two notes each time and only for patterns seen more than once. Sent with every reply.
# "What have you learned about me?" reads it out; "reset your personality" clears it.
rapport:
  enabled: true
  every_turns: 8

# browser-use (github.com/browser-use/browser-use): "use the browser to find ...". Her OWN
# browser profile (no logins), never signs in, buys, books, sends or submits anything.
browser_agent:
  enabled: true
  headless: false        # you can watch her browse
  max_steps: 25

# GPS: this laptop has none. A USB GPS (NMEA on a COM port) is found automatically; say
# "use my phone as GPS" to receive a phone app's NMEA over UDP on udp_port; or set
# tcp: "phone-ip:port" for an app that serves NMEA over TCP.
gps:
  enabled: true
  scan_serial: true
  udp_port: 10110
  tcp: ""

# Talk to VERONICA from your phone / other devices (veronica/ui/remote, docs in server.py).
# Listens on this PC only; Tailscale makes it reachable from YOUR devices over HTTPS:
#   tailscale serve --bg 7272      (run once on this PC)
remote:
  enabled: true                   # start the phone page with VERONICA (or use --remote)
  host: "127.0.0.1"               # keep local - never 0.0.0.0
  port: 7272
  confirm_timeout_s: 60           # permission question on the phone left unanswered = no

# One small real project a day, each in a NEW GitHub repo named after it (your portfolio), picked
# by VERONICA and built + tested by Claude Code in the background whenever the laptop is on. A
# shutdown or a Claude Code limit mid-build is resumed next time. Never touches VERONICA's own code.
# Needs GitHub CLI signed in once: gh auth login. Until then she waits.
# "What did you build?", "don't do anything today", "pause daily builds", "build a game next".
daily_builds:
  enabled: true
  visibility: public              # the new repos
  builder: Claude Code            # who writes the code; change it by voice ("use Antigravity instead of
                                  # Claude Code", "build them yourself"). Others: Antigravity, my own model.
  fallback: true                  # chosen builder hit its limit / is signed out -> she uses the next one and says so
  topics: ["python tool", "web app", "game", "cybersecurity learning (defensive)"]
  per_day: 1
  max_attempts: 3                 # tries per project before she moves on
  min_battery_percent: 30         # on battery below this she waits for the charger
